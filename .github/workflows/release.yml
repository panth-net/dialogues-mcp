name: Release

# Publishing is disabled until it is explicitly enabled:
#   1. set the repository variable DIALOGUES_RELEASE_ENABLED to "true",
#   2. configure npm trusted publishing for this repository and workflow file,
#   3. run this workflow by hand with the version and the exact confirmation text.
# Stages run in order (npm -> GitHub release -> MCP Registry). A rerun skips a stage
# only when the published artifact matches exactly, fails on any mismatch, and
# continues with later stages.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the v (must already be tagged)"
        required: true
      confirm:
        description: 'Type "publish <version>" to confirm'
        required: true

permissions:
  contents: read

jobs:
  prepare:
    if: vars.DIALOGUES_RELEASE_ENABLED == 'true' && github.event.inputs.confirm == format('publish {0}', github.event.inputs.version)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ github.event.inputs.version }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - name: Preflight (versions, scans, audit, tests, pack once, install check)
        run: node scripts/preflight.mjs --tag v${{ github.event.inputs.version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: .release/
          if-no-files-found: error

  npm:
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: .release
      - name: Publish the preflight artifact (trusted publishing)
        run: |
          set -euo pipefail
          FILE=$(node -p "require('./.release/manifest.json').filename")
          WANT=$(node -p "require('./.release/manifest.json').integrity")
          NAME=$(node -p "require('./.release/manifest.json').name")
          VERSION=$(node -p "require('./.release/manifest.json').version")
          HAVE=$(npm view "$NAME@$VERSION" dist.integrity 2>/dev/null || true)
          if [ -n "$HAVE" ]; then
            if [ "$HAVE" = "$WANT" ]; then echo "npm: $NAME@$VERSION already published with the same artifact; skipping" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
            echo "npm: $NAME@$VERSION exists with a different artifact ($HAVE). Versions are immutable; bump the version." >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          npm publish ".release/$FILE" --access public --provenance
          echo "npm: published $NAME@$VERSION ($WANT)" >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ github.event.inputs.version }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: .release
      - name: Create the GitHub release with the same artifact
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          FILE=$(node -p "require('./.release/manifest.json').filename")
          WANT=$(node -p "require('./.release/manifest.json').sha256")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release download "v$VERSION" --pattern "$FILE" --dir existing
            HAVE=$(sha256sum "existing/$FILE" | cut -d' ' -f1)
            if [ "$HAVE" = "$WANT" ]; then echo "GitHub release v$VERSION already has this artifact; skipping" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
            echo "GitHub release v$VERSION has a different artifact" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          awk -v v="$VERSION" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          gh release create "v$VERSION" ".release/$FILE" .release/manifest.json --title "v$VERSION" --notes-file notes.md --verify-tag
          echo "GitHub release v$VERSION created" >> "$GITHUB_STEP_SUMMARY"

  registry:
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ github.event.inputs.version }}
          persist-credentials: false
      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          set -euo pipefail
          curl -sSfL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Publish server.json to the MCP Registry
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./server.json').name")
          if curl -sSf "https://registry.modelcontextprotocol.io/v0/servers?search=$NAME" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const hit=(j.servers||[]).some(e=>(e.server||e).name===process.argv[1]&&(e.server||e).version===process.argv[2]);process.exit(hit?0:1)})' "$NAME" "$VERSION"; then
            echo "MCP Registry: $NAME $VERSION already listed; skipping" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
          echo "MCP Registry: published $NAME $VERSION" >> "$GITHUB_STEP_SUMMARY"
