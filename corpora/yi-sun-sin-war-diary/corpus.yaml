  notes: "No diary text is bundled. The Classical Chinese text of the 1795 jeonseo compilation downloads only after the user confirms the rights notice: the original is public domain, the Wikisource transcription carries no translation layer, and the ITKC transcription layer's exact open-license type is unconfirmed, so ITKC text stays local personal-use only. The standard English translation is in copyright and must be user-supplied; no modern Korean translation is downloaded."
