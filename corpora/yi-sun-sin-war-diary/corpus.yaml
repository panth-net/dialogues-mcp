id: yi-sun-sin-war-diary
title: Yi Sun-sin War Diary
subtitle: Nanjung Ilgi, seven years of the Imjin War from the admiral's own brush
tagline: "The Korean admiral's day-by-day war diary, written between naval battles he never lost — Hansan, Myeongnyang, Noryang — while fighting his own court as much as the Japanese."
description: >
  A curated-source capsule for Nanjung Ilgi, the war diary Admiral Yi Sun-sin
  kept from 1592 to 1598 during the Imjin War: fleet drills and turtle ships,
  weather lines and executions, his imprisonment and torture after court
  intrigue, the thirteen ships at Myeongnyang, grief for his mother and son,
  and his death at Noryang. The Classical Chinese text of the public-domain
  1795 Yi Chungmugong jeonseo compilation downloads from Korean Wikisource
  (books 5-7) and the ITKC classics database (book 8) after a rights
  confirmation. UNESCO Memory of the World; National Treasure of Korea.
languages:
  - lzh
  - ko
type: diary
