version: 1
corpus_id: yi-sun-sin-war-diary
source_policy: user_downloaded_from_original_sources
default_mode: curated-core
download_modes:
  curated-core:
    visible_to_users: true
    description: "The Classical Chinese diary text from the public-domain 1795 Yi Chungmugong jeonseo compilation: books 5-7 from Korean Wikisource, and the 13 surviving months of book 8 (April 1597 - November 1598) from the ITKC Korean classics database, downloaded after an explicit rights confirmation. Catalog records for the autograph manuscript and the copyrighted English translation stay pointers."
  full-dev:
    visible_to_users: false
    description: "Curator-only candidates for fuller Imjin War source work."
paths:
  command-at-sea:
    title: "Command at Sea"
    point: "Follow drills, formations, turtle ships, and the battles from Okpo and Hansan to Myeongnyang and Noryang."
  court-and-injustice:
    title: "Court and Injustice"
    point: "Trace the 1597 arrest, torture, and demotion, Won Gyun's disaster at Chilcheollyang, and the reinstatement."
  camp-life-day-by-day:
    title: "Camp Life Day by Day"
    point: "Read the terse daily record: weather lines, illness, executions, dreams, and grief for his mother and son."
