version: 1
corpus_id: whitman-papers
source_policy: user_downloaded_from_original_sources
default_mode: curated-core
download_modes:
  curated-core:
    visible_to_users: true
    description: "Curated Walt Whitman Archive TEI transcriptions: Civil War hospital letters, Doyle letters, Emerson's 1855 greeting, late Camden letters, and five working notebooks."
  full-dev:
    visible_to_users: false
    description: "Curator-only candidates for fuller Whitman source work."
paths:
  civil-war-hospitals:
    title: "Civil War Hospitals"
    point: "Follow 1863-1864 Washington: hospital rounds, wounded soldiers named bed by bed, and family news in letters to his mother Louisa."
  doyle-and-comradeship:
    title: "Doyle and Comradeship"
    point: "Read the 'Dear Pete' letters to horsecar conductor Peter Doyle, the fullest record of Whitman's affections."
  emerson-and-recognition:
    title: "Emerson and Recognition"
    point: "Start from Emerson's 1855 greeting 'at the beginning of a great career' and his 1863 introductions for Whitman in Washington."
  camden-and-last-years:
    title: "Camden and Last Years"
    point: "Watch the paralyzed poet at 328 Mickle Street manage editions, visitors, symptoms, and reputation, 1873-1892."
  notebooks-and-drafts:
    title: "Notebooks and Drafts"
    point: "Trace Leaves of Grass and the hospital visits back to pencil drafts and field notes in Whitman's working notebooks."
