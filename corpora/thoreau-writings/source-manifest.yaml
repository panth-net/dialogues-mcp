  full-dev:
    visible_to_users: false
    description: "Curator-only harvest of additional Thoreau candidates."
paths:
  journals-and-daily-observation:
    title: "Journals and Daily Observation"
    point: "Recover how Thoreau made thought out of repeated attention to ordinary days."
  letters-and-relationships:
    title: "Letters and Relationships"
    point: "See Thoreau as correspondent, friend, brother, neighbor, and working writer."
  work-solitude-and-economy:
    title: "Work, Solitude, and Economy"
    point: "Trace labor, money, necessity, shelter, and self-discipline."
  conscience-and-public-duty:
    title: "Conscience and Public Duty"
    point: "Follow moral reasoning about state power, slavery, war, and public obligation."
  nature-as-method:
    title: "Nature as Method"
    point: "Use field observation and walking as evidence of how thinking happens."
  travel-and-field-notes:
    title: "Travel and Field Notes"
    point: "Read travel and excursion writing as observation under changing conditions."
