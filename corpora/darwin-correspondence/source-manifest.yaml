version: 1
corpus_id: darwin-correspondence
source_policy: user_downloaded_from_original_sources
default_mode: curated-core
download_modes:
  curated-core:
    visible_to_users: true
    description: "Selected Darwin documents that reveal questions, observations, experiments, correspondence, and revision."
  full-dev:
    visible_to_users: false
    description: "Curator-only harvest of all candidate records."
paths:
  thought-before-theory:
    title: "Thought before Theory"
    point: "Find questions, doubts, and unfinished reasoning before later closure."
  species-and-variation:
    title: "Species and Variation"
    point: "Trace species problems, variation, breeding, and selection."
  experiments-and-observations:
    title: "Experiments and Observations"
    point: "Follow practical trials, measurements, specimens, and observations."
  network-of-correspondents:
    title: "Network of Correspondents"
    point: "Read theory formation as exchange across people."
  illness-work-and-family:
    title: "Illness, Work, and Family"
    point: "Track bodily and domestic constraints on scientific work."
  marginalia-and-reading:
    title: "Marginalia and Reading"
    point: "Use notes and reading records as evidence of influence and reaction."
  public-private-science:
    title: "Public and Private Science"
    point: "Compare private letters, drafts, reviews, and publication decisions."
