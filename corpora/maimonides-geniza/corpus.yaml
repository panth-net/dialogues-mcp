id: maimonides-geniza
title: Maimonides in the Cairo Geniza
subtitle: Autograph drafts, letters, and responsa of Moses Maimonides preserved in a synagogue storeroom
tagline: "Autograph drafts and letters of the great medieval philosopher-physician, preserved by accident for 800 years in a Cairo synagogue storeroom."
description: >
  A hybrid capsule for Maimonides (1138-1204): catalog records for the Cairo
  Geniza material — Judeo-Arabic working drafts of the Mishneh Torah and the
  Guide of the Perplexed, responsa answered in his own hand, medical and
  communal correspondence, and the letters around his brother David's death
  at sea, as the Ben Ezra synagogue storeroom preserved them — plus
  downloadable public-domain English translations of the finished works
  (the Guide for the Perplexed and the Eight Chapters) so the books behind
  the drafts can be read and searched locally.
languages:
