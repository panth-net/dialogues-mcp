version: 1
corpus_id: tolstoy-diaries
source_policy: user_downloaded_from_original_sources
default_mode: curated-core
download_modes:
  curated-core:
    visible_to_users: true
    description: "Three Jubilee-edition diary volumes spanning youth (1847-1854), the 1890s crisis years (1891-1894), and the final year (1910), as searchable PDFs from tolstoy.ru."
  full-dev:
    visible_to_users: false
    description: "Curator-only candidates including further diary volumes of the Jubilee edition."
paths:
  youth-and-self-making:
    title: "Youth and Self-Making"
    point: "Watch the young Tolstoy invent himself: rules of life, gambling losses, the Caucasus, army service, and the first published fiction."
  moral-accounting-and-vows:
    title: "Moral Accounting and Vows"
    point: "Follow sixty years of vows, graded failures, and self-reproach — the diary as a ledger of the soul."
  famine-and-social-conscience:
    title: "Famine and Social Conscience"
    point: "Read the 1891-1893 famine relief at Begichevka, the renunciation of copyright, and the guilt of privilege."
  art-and-the-writing-life:
    title: "Art and the Writing Life"
    point: "Trace fiction and the war against fiction: Detstvo and Sovremennik in the 1850s, the struggle to write about art in the 1890s."
  last-year-and-departure:
    title: "The Last Year and the Departure"
    point: "Live through 1910 day by day: Sofia Andreevna, Chertkov, the secret will, the flight from Yasnaya Polyana, Astapovo."
