  full-dev:
    visible_to_users: false
    description: "Curator-only harvest of all candidate records."
paths:
  crimea-and-army-health:
    title: "Crimea and Army Health"
    point: "Follow Scutari, the Barrack Hospital, and the post-war program to reform military nursing and army sanitation."
  the-notes-on-nursing-voice:
    title: "The Notes on Nursing Voice"
    point: "Read the 1859 handbook that made nursing observational: ventilation, noise, light, food, and 'petty management'."
  data-as-argument:
    title: "Data as Argument"
    point: "Watch mortality returns, comparative tables, and death rates being turned into public-policy weapons."
  training-a-profession:
    title: "Training a Profession"
    point: "Trace the Nightingale Training School and what she demanded of matrons and probationers."
  letters-and-the-sickroom:
    title: "Letters and the Sickroom"
    point: "See the bedridden decades: addresses and letters written from the room she ran her campaigns from."
