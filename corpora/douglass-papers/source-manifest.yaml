version: 1
corpus_id: douglass-papers
source_policy: user_downloaded_from_original_sources
default_mode: curated-core
download_modes:
  curated-core:
    visible_to_users: true
    description: "Selected Douglass documents that reveal strategy, editing, argument, conflict, and Reconstruction work."
  full-dev:
    visible_to_users: false
    description: "Curator-only harvest of all candidate records."
paths:
  douglass-as-strategist:
    title: "Douglass as Strategist"
    point: "Recover public argument as tactical and institutional work."
  douglass-as-editor:
    title: "Douglass as Editor"
    point: "Follow newspaper labor, publication choices, and public platform building."
  movement-conflict:
    title: "Movement Conflict"
    point: "Study disagreement, alliance, and pressure inside reform movements."
  private-public-douglass:
    title: "Private and Public Douglass"
    point: "Compare public rhetoric with letters, family papers, and private constraints."
  reconstruction-citizenship:
    title: "Reconstruction Citizenship"
    point: "Trace citizenship, voting, rights, and postwar institutional argument."
  lost-early-douglass:
    title: "Lost Early Douglass"
    point: "Mark early-document loss and avoid false completeness."
