version: 1
corpus_id: faraday-papers
source_policy: public_domain_downloads_plus_catalog_or_user_supplied_for_manuscripts
default_mode: curated-core
download_modes:
  curated-core:
    visible_to_users: true
    description: "Selected Faraday public-domain texts plus catalog-only manuscript, apparatus, and correspondence records."
  full-dev:
    visible_to_users: false
    description: "Curator-only harvest of all candidate records."
paths:
  experimental-thinking:
    title: "Experimental Thinking"
    point: "Find observation, trial, repetition, and reasoning from results."
  notebooks-and-instruments:
    title: "Notebooks and Instruments"
    point: "Trace notebooks, apparatus, diagrams, and material practice."
  lecture-notes-as-self-education:
    title: "Lecture Notes as Self-Education"
    point: "Study lectures as learning, preparation, and demonstration."
  letters-and-demonstration:
    title: "Letters and Demonstration"
    point: "Follow correspondence around experiments, requests, and demonstrations."
  electricity-before-theory:
    title: "Electricity before Theory"
    point: "Watch vocabulary and experiment before later theory stabilizes."
  public-science:
    title: "Public Science"
    point: "Study audience, institution, demonstration, and explanation."
