paths:
  apprenticeship-and-voice:
    title: "Apprenticeship and Voice"
    point: "Trace young Clemens learning work, place, ambition, and voice."
  travel-lecture-and-public-persona:
    title: "Travel, Lecture, and Public Persona"
    point: "Read travel and platform work as the machinery behind Mark Twain."
  authorship-and-publishing:
    title: "Authorship and Publishing"
    point: "Follow books, proofs, copyright, publishers, editors, and literary labor."
  family-money-and-business-risk:
    title: "Family, Money, and Business Risk"
    point: "Connect domestic life, debt, investment, earning, and obligation."
  grief-age-and-late-darkness:
    title: "Grief, Age, and Late Darkness"
    point: "Ground late-life bitterness and sorrow in dated letters."
  humor-private-public-gap:
    title: "Humor and the Private/Public Gap"
    point: "Ask how comic performance, affection, anger, and self-presentation interact."
