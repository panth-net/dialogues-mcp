id: mark-twain-letters
title: Mark Twain Letters
subtitle: Letters from apprenticeship through late life, public persona, family, money, and authorship
tagline: "Six decades of letters from Samuel Clemens — the making, marketing, bankruptcy, and private grief of America's funniest man."
description: >
  A curated-source capsule for recovering Mark Twain/Samuel Clemens in letters:
  apprenticeship, travel, lectures, authorship, publishing, business risk,
  family life, grief, public persona, humor, and late-life bitterness.
languages:
  - en
type: correspondence
status: source_manifest_ready
data_policy: curated_public_source_manifest_only
default_search_mode: fts
guide: guide.md
search_rules: search-rules.md
source_notes: source-notes.md
citation_rules: citation-rules.md
selection_rules: selection-rules.md
source_manifest: source-manifest.yaml
downloadable: true
download_policy: curated_public_source
fields:
  - doc_id
  - title
  - author
  - recipient
  - date
  - document_type
  - source_item_id
  - selection_paths
  - curator_score
  - chunk_index
chunking:
  min_chars: 300
  max_chars: 1400
  overlap_chars: 120
  preserve_paragraphs: true
license:
  data_included: false
  user_must_confirm_rights: true
  notes: "No Mark Twain source text is bundled. Users download selected Project Gutenberg public-domain texts locally after reviewing source terms."
