id: jane-austen-letters
title: Jane Austen Letters
subtitle: Selected surviving letters as evidence of wit, family life, writing, and gaps
tagline: "Austen's surviving letters, mostly to her sister Cassandra — sharp, domestic, and gossipy; the novelist off duty."
description: >
  A curated-source capsule for reading Jane Austen's selected surviving letters
  as evidence of practical thought: family obligation, illness, money, social
  judgment, wit, publication, travel, and the limits created by survival and
  editorial selection.
languages:
  - en
type: correspondence
status: source_manifest_ready
data_policy: curated_public_source_manifest_only
default_search_mode: fts
guide: guide.md
search_rules: search-rules.md
source_notes: source-notes.md
citation_rules: citation-rules.md
selection_rules: selection-rules.md
source_manifest: source-manifest.yaml
downloadable: true
download_policy: curated_public_source
fields:
  - doc_id
  - title
  - author
  - recipient
  - date
  - document_type
  - source_item_id
  - selection_paths
  - curator_score
  - chunk_index
chunking:
  min_chars: 300
  max_chars: 1400
  overlap_chars: 120
  preserve_paragraphs: true
license:
  data_included: false
  user_must_confirm_rights: true
  notes: "No Jane Austen source text is bundled. Users download the selected Project Gutenberg public-domain text locally after reviewing source terms."
