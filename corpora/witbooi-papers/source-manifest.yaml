version: 1
corpus_id: witbooi-papers
source_policy: user_downloaded_from_original_sources
default_mode: curated-core
download_modes:
  curated-core:
    visible_to_users: true
    description: "The DBNL digitization of the 1929 Van Riebeeck Society edition of Witbooi's captured letter-book, downloaded after an explicit rights confirmation."
  full-dev:
    visible_to_users: false
    description: "Curator-only candidates for fuller Witbooi source work."
paths:
  land-treaties-and-sovereignty:
    title: "Land, Treaties, and Sovereignty"
    point: "Follow Witbooi's legal-moral argument: land, regeringsreg, protection treaties, and the warning that signing them away will be eternally regretted."
  german-colonial-confrontation:
    title: "German Colonial Confrontation"
    point: "Read the exchanges with Goering, von Francois, and Leutwein, and the road from refusal of the Schutzvertrag to the storm of Hoornkrans."
  naukluft-war-and-surrender:
    title: "Naukluft War and Surrender"
    point: "Trace the Naauwkloof letters of May-August 1894 and the campaign that ended in surrender to Leutwein on 15 September 1894."
  nama-herero-diplomacy:
    title: "Nama-Herero Diplomacy"
    point: "Watch letters to Jan Jonker Afrikaner, Maharero, and other kapteins manage war, peace, and rivalry inside Namaland and Hereroland."
  faith-and-calling:
    title: "Faith and Calling"
    point: "See how Witbooi reasons from God's will and his own calling when he explains war, peace, and refusal to submit."
  capture-and-afterlife:
    title: "Capture and Afterlife of the Letter-Book"
    point: "Understand how the book was seized at Hoornkrans in 1893, edited by settlers in 1929, and later honored as UNESCO Memory of the World."
