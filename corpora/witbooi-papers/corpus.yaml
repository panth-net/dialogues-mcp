id: witbooi-papers
title: Hendrik Witbooi Papers
subtitle: The captured letter-book of a Nama kaptein, 1884-1894, from Gibeon and Hoornkrans to the Naukluft war
tagline: "Nama kaptein whose captured letter-books record diplomacy, warning, and armed resistance against German colonial power — in his own words."
description: >
  A curated-source capsule for the letter-book and diary of Hendrik Witbooi
  (c. 1830-1905), kaptein of the Witbooi Nama at Gibeon in what is now Namibia:
  letters to Herero and Nama leaders, to German commissioners, officers, and
  governors, and to Cape officials, arguing land, treaties, sovereignty, and
  the right to wage war, from his succession in 1884 through the German storm
  of Hoornkrans in 1893 and the Naukluft correspondence of 1894.
languages:
  - nl
  - af
type: letter_book
