version: 1
corpus_id: lincoln-papers
source_policy: user_downloaded_from_original_sources
default_mode: curated-core
download_modes:
  curated-core:
    visible_to_users: true
    description: "Selected Lincoln documents that best reveal thinking, reasoning, pressure, revision, and working context."
  full-dev:
    visible_to_users: false
    description: "Curator-only harvest of all candidate records."
paths:
  legal-mind:
    title: "Lincoln's Legal Mind"
    point: "Recover how Lincoln reasoned as a working lawyer and constitutional thinker."
  emancipation-in-motion:
    title: "Emancipation in Motion"
    point: "Trace policy formation, revision, constraint, and response to pressure."
  humor-human-lincoln:
    title: "Humor and Human Lincoln"
    point: "Find documents that show tone, jokes, ordinary language, and social instinct."
  war-as-paperwork:
    title: "War as Paperwork"
    point: "Follow how war became letters, orders, telegrams, appointments, and pardons."
  incoming-pressure:
    title: "Incoming Pressure"
    point: "Track petitions, requests, criticism, recommendations, and demands."
  public-private-lincoln:
    title: "Public and Private Lincoln"
    point: "Compare public language with drafts, notes, and private working documents."
  lincoln-after-lincoln:
    title: "Lincoln after Lincoln"
    point: "Separate memory, commemoration, and myth-making from working evidence."
