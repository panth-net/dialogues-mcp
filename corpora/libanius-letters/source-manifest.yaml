version: 1
corpus_id: libanius-letters
source_policy: user_downloaded_from_original_sources
default_mode: curated-core
download_modes:
  curated-core:
    visible_to_users: true
    description: "OCR text of the two letter volumes (X-XI) of Foerster's public-domain Teubner edition from the Internet Archive, plus catalog-only pointers for verification."
  full-dev:
    visible_to_users: false
    description: "Curator-only candidates for fuller Libanius source work (orations volumes, declamations, future clean digital texts)."
paths:
  recommendation-and-patronage:
    title: "Recommendation and Patronage"
    point: "Read the social engine of the late-antique elite: letters recommending students, begging favors from governors, and calling in debts of friendship."
  julian-and-the-court:
    title: "Julian and the Court"
    point: "Follow the correspondence with the emperor Julian and with prefects, governors, and officials across the Roman East."
  antioch-and-the-school:
    title: "Antioch and the School"
    point: "Watch Antioch and the rhetoric school at work: recruiting students, fighting rivals, managing a city's grandees."
  pagan-twilight:
    title: "Pagan Twilight"
    point: "Trace the lament of a Hellene as temples close and the empire Christianizes under Theodosius."
