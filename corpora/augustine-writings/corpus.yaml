id: augustine-writings
title: Augustine of Hippo Writings
subtitle: Confessions in English and Latin, The City of God, and the letters of a working bishop
tagline: "The late-Roman bishop who invented introspective autobiography — conversion, grief, memory, and time, argued in the first person."
description: >
  A curated-source capsule for Augustine of Hippo (354-430): the Confessions
  in Pusey's English translation and in Latin, both volumes of The City of God
  in the Dods translation, and a selection of his letters. Conversion and the
  divided will, memory and time, grief and friendship, the sack of Rome and
  the two cities, and the pastoral business of a North African bishopric.
languages:
