paths:
  conversion-and-the-will:
    title: "Conversion and the Will"
    point: "Follow the divided will to the garden in Milan: Books VI-VIII of the Confessions."
  memory-and-time:
    title: "Memory and Time"
    point: "Read the philosophical core: the palaces of memory in Book X and the analysis of time in Book XI."
  grief-and-friendship:
    title: "Grief and Friendship"
    point: "Trace the friend's death in Book IV, Adeodatus, and Monica's death at Ostia in Book IX."
  sack-of-rome-and-two-cities:
    title: "The Sack of Rome and the Two Cities"
    point: "Watch Augustine answer 410: the pagan accusation, and the earthly and heavenly cities."
  pastoral-letters:
    title: "Pastoral Letters"
    point: "See the working bishop: Jerome, the Donatists, consolation, and church governance in the correspondence."
