id: evliya-celebi-travels
title: Evliya Celebi Travels
subtitle: The opening of the Seyahatname — Istanbul described, then the first roads east
tagline: "Ottoman gentleman-traveler who spent forty years wandering three continents and wrote ten volumes of it — wit, tall tales, and detail nobody else recorded."
description: >
  A curated-source capsule for the first two volumes of Evliya Celebi's
  Seyahatname in the von Hammer English translation: the dream that
  licensed a life of travel, Constantinople's walls, talismans, sieges,
  mosques, and sultans, and the first journeys out — Bursa, Trabzon,
  Georgia and Mingrelia, Azov, the Crimea, the siege of Canea on Crete,
  Erzurum, and the Persian mission to Tabriz.
languages:
  - en
type: travel_narrative
