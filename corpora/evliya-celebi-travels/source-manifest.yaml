paths:
  istanbul-described:
    title: "Istanbul Described"
    point: "Walk the imperial city: foundation legends, twenty-seven gates, sixty-six talismans, nine sieges, and the conquest of 1453."
  sultans-and-the-court:
    title: "Sultans and the Court"
    point: "Read the imperial mosques and reign-by-reign rosters from Suleyman to Mehmed IV, with Murad IV's palace seen from inside."
  roads-and-journeys:
    title: "Roads and Journeys"
    point: "Ride the first circuits: Bursa's hot springs, Trabzon, Mingrelia, the Crimea, Erzurum, and the mission to Tabriz."
  war-and-frontier:
    title: "War and the Frontier"
    point: "Follow the Azov campaign, Tatar raids, the siege of Canea on Crete, and a Black Sea storm survived by inches."
  marvels-and-tall-tales:
    title: "Marvels and Tall Tales"
    point: "Collect talismans, enchanted columns, miracles, and glorious exaggerations — the wonders the genre demanded."
