version: 1
corpus_id: john-quincy-adams-diary
source_policy: user_downloaded_from_original_sources
default_mode: curated-core
download_modes:
  curated-core:
    visible_to_users: true
    description: "The complete twelve-volume public-domain Memoirs of John Quincy Adams (ed. Charles Francis Adams, 1874-1877), downloaded as OCR text from the Internet Archive, plus catalog pointers to the complete modern Digital Diary transcription."
  full-dev:
    visible_to_users: false
    description: "Curator-only candidates for fuller Adams source work."
paths:
  diplomacy-and-cabinet:
    title: "Diplomacy and Cabinet"
    point: "Follow The Hague, Berlin, St. Petersburg, Ghent, and the State Department under Monroe from the inside."
  presidency-and-party-battles:
    title: "Presidency and Party Battles"
    point: "Watch the 1824 election decided in the House, the 'corrupt bargain' charge, the embattled presidency, and the 1828 defeat by Jackson."
  antislavery-house-years:
    title: "Antislavery House Years"
    point: "Track petitions, the gag rule fight of 1836-1844, the Amistad argument, and the censure battles."
  self-scrutiny-and-science:
    title: "Self-Scrutiny and Science"
    point: "Read the self-assessments, Potomac swims, Bible reading, and the astronomy and observatory obsession."
