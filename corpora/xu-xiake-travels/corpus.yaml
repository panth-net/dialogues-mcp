  user_must_confirm_rights: true
  notes: "No diary text is bundled. Users download curated chapters locally from Chinese Wikisource (public-domain Ming text; transcription reusable under CC BY-SA 4.0) after reviewing source terms. The Chinese Text Project transcription remains catalog-only under its terms of use."
