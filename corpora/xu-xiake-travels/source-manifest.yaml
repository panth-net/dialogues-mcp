version: 1
corpus_id: xu-xiake-travels
source_policy: user_downloaded_from_original_sources
default_mode: curated-core
download_modes:
  curated-core:
    visible_to_users: true
    description: "Sixteen curated chapters of the Xu Xiake Youji downloaded from Chinese Wikisource: the famous early mountain diaries, the southwest expedition diaries, and the river-source treatises."
  full-dev:
    visible_to_users: false
    description: "Curator-only candidates for fuller Xu Xiake source work (annotated editions, manuscript facsimiles)."
paths:
  southwest-expedition:
    title: "The Southwest Expedition"
    point: "Follow the last great journey, 1636-1640: Zhejiang and Jiangxi out to Hunan, Guangxi, Guizhou, and Yunnan."
  karst-and-caves:
    title: "Karst and Caves"
    point: "Read the cave surveys: limestone towers around Guilin, torch-lit passages, measured depths, stalactites described one chamber at a time."
  rivers-and-sources:
    title: "Rivers and Sources"
    point: "Trace the hydrographic arguments, above all the case that the Jinsha River, not the Min, is the true upper course of the Yangtze."
  travel-practice-and-companions:
    title: "Travel Practice and Companions"
    point: "Watch the diary-per-day routine: distances in li, lodging, food, weather, the servant Gu Xing, and the monk Jingwen who died on the road."
