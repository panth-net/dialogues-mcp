id: babad-diponegoro
title: Babad Diponegoro
subtitle: Prince Diponegoro's verse autobiography of the Java War, written in exile
tagline: "A Javanese prince's verse autobiography, written in exile after leading the largest anti-colonial war Java ever saw."
description: >
  A curated-source capsule for the Babad Diponegoro, the autobiographical
  chronicle of Prince Diponegoro (1785-1855), leader of the Java War
  (1825-1830), composed in Javanese verse during his exile in Manado in
  1831-1832: the road stakes through Tegalrejo that sparked the war, five
  guerrilla years, the capture at Magelang during negotiations, and the babad
  genre's weave of prophecy, ancestry, and event. Inscribed in the UNESCO
  Memory of the World register in 2013. A romanized transliteration of the
  LOr 6547 manuscript downloads canto by canto from an openly hosted
  archive.org item after a rights confirmation (41 of 43 cantos; the
  transliteration layer is uncredited and unvetted, so treat it as a working
  text).
languages:
  - jv
type: verse_chronicle
