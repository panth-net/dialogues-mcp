version: 1
corpus_id: babad-diponegoro
source_policy: user_downloaded_from_original_sources
default_mode: curated-core
download_modes:
  curated-core:
    visible_to_users: true
    description: "The romanized (Latin-script) transliteration of the Babad Dipanagara autobiographical manuscript (LOr 6547), downloaded canto by canto from an openly hosted archive.org item after an explicit rights confirmation. 41 of 43 cantos; cantos 7 and 12 are broken stubs in the source and are excluded. Catalog pointers to the EAP scans and a manuscript facsimile stay pointers."
  full-dev:
    visible_to_users: false
    description: "Curator-only candidates for fuller Diponegoro source work (other babad recensions, Dutch colonial records)."
paths:
  tegalrejo-and-the-outbreak:
    title: "Tegalrejo and the Outbreak"
    point: "Start where the war starts: the sacred-land dispute and the road stakes driven through Diponegoro's estate at Tegalrejo in 1825."
  guerrilla-years:
    title: "The Guerrilla Years"
    point: "Follow the five-year war, 1825-1830: Selarong, Kyai Mojo, Sentot, and the Dutch fortress system that ground the rising down."
  capture-and-exile:
    title: "Capture and Exile"
    point: "Read the end from the inside: arrest at Magelang during negotiations in March 1830, then exile to Manado, where the babad was written, and Makassar."
  prophecy-lineage-and-genre:
    title: "Prophecy, Lineage, and Genre"
    point: "See how a babad works: macapat verse mixing visions of the Ratu Adil, descent from the Mataram sultans, and the events of a life."
