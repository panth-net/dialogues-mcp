    why_keep: "The sermon that made Occom the first Native American to publish in English: preached at the hanging of the Mohegan Moses Paul, on 'the wages of sin is death', with a direct address to 'my poor kindred' on drink and colonial ruin."
    metadata:
      ia_identifier: "sermonatexecutio01occo"
      edition: "Public-domain scan of a London reprint; OCR text with long-s errors"
      access_note: "The reprint's preface misdates Occom's England tour to 1776-1777; the tour was 1766-1768."
