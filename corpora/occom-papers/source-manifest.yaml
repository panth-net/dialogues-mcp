version: 1
corpus_id: occom-papers
source_policy: user_downloaded_from_original_sources
default_mode: curated-core
download_modes:
  curated-core:
    visible_to_users: true
    description: "Selected Occom Circle transcriptions (Dartmouth) plus the public-domain Moses Paul execution sermon."
  full-dev:
    visible_to_users: false
    description: "Curator-only candidates for fuller Occom source work."
paths:
  two-worlds-and-identity:
    title: "Two Worlds and Identity"
    point: "Read Occom narrating himself: born 'a Heathen', made a minister, paid and trusted as neither."
  occom-and-wheelock:
    title: "Occom and Wheelock"
    point: "Follow the relationship from student letters to the 1771-1772 break over school funds and Dartmouth."
  mission-journals:
    title: "Mission Journals"
    point: "Ride with the itinerant ministry: Montauk, Oneida country, and decades of Sabbath-by-Sabbath preaching."
  brothertown-and-land:
    title: "Brothertown and Land"
    point: "Trace the Brothertown migration, Mohegan land politics, leases, and petitions to legislatures."
  preaching-and-print:
    title: "Preaching and Print"
    point: "Study the execution sermon for Moses Paul, the hymns, and Occom's voice as a published author."
