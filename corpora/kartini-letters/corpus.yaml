id: kartini-letters
title: Kartini Letters
subtitle: Letters of Raden Adjeng Kartini on seclusion, education, and colonial Java, 1899-1904
tagline: "A Javanese noblewoman writing Dutch pen friends about colonialism, seclusion, and women's education — she died at 25 and the letters became a national cause."
description: >
  A curated-source capsule for the letters of Raden Adjeng Kartini
  (1879-1904), daughter of the Regent of Japara: seclusion inside the
  regency house, the fight to study, Dutch pen friends and colonial
  society, the case against polygamy and her own marriage to the Regent
  of Rembang, Javanese art and belief, and the school for girls she
  opened before dying at twenty-five — in the Dutch original and the
  shorter English translation.
languages:
  - nl
  - en
type: correspondence
