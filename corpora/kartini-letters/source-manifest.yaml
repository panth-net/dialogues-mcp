paths:
  seclusion-and-freedom:
    title: "Seclusion and Freedom"
    point: "Read the cage years: taken from school at twelve, locked in the regency, and writing her way out."
  education-and-the-school-plan:
    title: "Education and the School Plan"
    point: "Follow the fight to study — Holland, the scholarship won and renounced — and the school for girls she actually opened."
  colonial-java:
    title: "Colonial Java"
    point: "See Dutch rule in the ethical-policy years from inside a Javanese regent's house: officials, etiquette, opium, and the people's poverty."
  marriage-and-polygamy:
    title: "Marriage and Polygamy"
    point: "Track the case against polygamy from the first letter to Stella through her own marriage to the Regent of Rembang."
  javanese-art-and-culture:
    title: "Javanese Art and Culture"
    point: "Find gamelan, batik, wajang, and the Japara wood-carvers she championed for Dutch audiences."
