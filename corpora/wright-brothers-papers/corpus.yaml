id: wright-brothers-papers
title: Wilbur and Orville Wright Papers
subtitle: How two bicycle mechanics reasoned their way into the air, 1899-1913
tagline: "Two bicycle mechanics work out powered flight — Orville's own account of December 17, 1903, plus catalog pointers to the Kitty Hawk diaries at the Library of Congress."
description: >
  A curated-source capsule for the Wright brothers' own accounts of inventing
  the airplane: Wilbur's 1901 lecture to the Western Society of Engineers,
  the brothers' 1908 Century Magazine article, Orville's narrative of the
  December 17, 1903 flights, and Octave Chanute's 1894 survey that formed
  their starting library — plus catalog records mapping the Library of
  Congress manuscript diaries, notebooks, and correspondence.
languages:
  - en
type: documentary_archive
status: source_manifest_ready
data_policy: curated_public_source_manifest_only
default_search_mode: fts
guide: guide.md
search_rules: search-rules.md
source_notes: source-notes.md
citation_rules: citation-rules.md
source_manifest: source-manifest.yaml
downloadable: true
download_policy: curated_public_source
fields:
  - doc_id
  - title
  - author
  - recipient
  - date
  - document_type
  - source_item_id
  - selection_paths
  - curator_score
  - chunk_index
chunking:
  min_chars: 300
  max_chars: 1400
  overlap_chars: 120
  preserve_paragraphs: true
license:
  data_included: false
  user_must_confirm_rights: true
  notes: "No source text is bundled. Users download public-domain published texts from Project Gutenberg and the Internet Archive locally. The Library of Congress manuscript diaries, notebooks, and letters are digitized as images and PDFs without transcriptions, so they remain catalog-only records here."
