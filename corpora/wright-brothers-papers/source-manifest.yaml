version: 1
corpus_id: wright-brothers-papers
source_policy: user_downloaded_from_original_sources
default_mode: curated-core
download_modes:
  curated-core:
    visible_to_users: true
    description: "The Wright brothers' public-domain published accounts and Chanute's 1894 survey, plus catalog records for the LOC manuscript diaries and correspondence."
  full-dev:
    visible_to_users: false
    description: "Curator-only harvest of all candidate records."
paths:
  wrights-in-their-own-words:
    title: "The Wrights in Their Own Words"
    point: "Read the brothers' own narratives of how they worked out lift, control, and propulsion."
  glider-years-at-kitty-hawk:
    title: "Glider Years at Kitty Hawk"
    point: "Follow 1900-1902: kites, gliders, disappointing lift tables, the wind tunnel, and the control problem."
  first-flight-1903:
    title: "First Flight, 1903"
    point: "Reconstruct December 14-17, 1903: motor, propellers, the launching track, four flights, and the telegram home."
  aeronautical-inheritance:
    title: "Aeronautical Inheritance"
    point: "Study what the brothers started from: Lilienthal, Chanute, Langley, and the Smithsonian reading list of 1899."
