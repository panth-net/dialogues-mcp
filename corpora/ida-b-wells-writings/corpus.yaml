id: ida-b-wells-writings
title: Ida B. Wells Writings
subtitle: The anti-lynching investigations, 1892-1900, with the case lists that made denial impossible
tagline: "Investigative journalist who documented American lynching with names, dates, and statistics when publishing them got her presses destroyed."
description: >
  A curated-source capsule for Ida B. Wells's three anti-lynching pamphlets:
  Southern Horrors (1892), The Red Record (1895), and Mob Rule in New Orleans
  (1900). Documented cases with names, dates, and places; tabulated statistics;
  the dismantling of the "usual charge" pretext; the economics of racial
  terror; boycotts and the Black press; and calls to investigation, publicity,
  and self-defense.
languages:
