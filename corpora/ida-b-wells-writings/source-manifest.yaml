paths:
  case-lists-and-statistics:
    title: "Case Lists and Statistics"
    point: "Read the evidentiary core: named victims, dated cases, and the tabulated 1892-1894 lynching statistics."
  unmasking-the-usual-charge:
    title: "Unmasking the Usual Charge"
    point: "Follow the argument that the rape accusation was a pretext, proven against the record's own alleged causes."
  economics-boycott-and-press:
    title: "Economics, Boycott, and the Press"
    point: "Trace lynching as economic terror, the Memphis boycott and Oklahoma emigration, and what publishing cost Wells."
  self-defense-and-remedies:
    title: "Self-Defense and Remedies"
    point: "Study the calls to action: investigation, publicity, agitation, and the Winchester rifle passage."
