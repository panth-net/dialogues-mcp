version: 1
corpus_id: gandhi-collected-works
source_policy: user_downloaded_from_original_sources
default_mode: curated-core
download_modes:
  curated-core:
    visible_to_users: true
    description: "Five CWMG volumes downloaded as OCR text from openly hosted archive.org scans of the Publications Division print edition, after an explicit rights confirmation, plus catalog pointers to session-gated Gandhi Heritage Portal volumes that have no verified open mirror."
  full-dev:
    visible_to_users: false
    description: "Curator-only candidates for wider CWMG coverage."
paths:
  south-africa-satyagraha:
    title: "South Africa Satyagraha"
    point: "Follow the method being invented: Durban petitions in the 1890s, the Transvaal struggle of 1908, and Hind Swaraj written on the voyage home in 1909."
  salt-march-and-civil-disobedience:
    title: "Salt March and Civil Disobedience"
    point: "Read March-December 1930: Sabarmati to Dandi, the salt law broken, the country following, the arrest of 5 May, and the Yeravda prison letters."
  quit-india:
    title: "Quit India"
    point: "Track April-December 1942: the Quit India resolution, 'do or die', mass arrests, and detention in the Aga Khan Palace. Pointer-only: no open mirror of vol. 76 has been verified, so this path has no downloadable text yet."
