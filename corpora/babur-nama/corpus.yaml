id: babur-nama
title: The Baburnama
subtitle: Memoirs of Babur — ruler of Fergana at eleven, king of Kabul, first Mughal emperor
tagline: "Founder of the Mughal Empire writing his own life with disarming honesty — battles lost, kingdoms won, gardens planted, and homesickness for melons."
description: >
  A curated-source capsule for the Baburnama, the memoirs of Zahir-ud-din
  Muhammad Babur (1483-1530): Fergana inherited at eleven, Samarkand won
  and lost, the throneless wandering years, the taking of Kabul in 1504,
  victory at Panipat and Khanua, the founding of Mughal rule in Hindustan,
  and a king's plain-spoken record of gardens, fruit, wine, verse, grief,
  and his own faults.
