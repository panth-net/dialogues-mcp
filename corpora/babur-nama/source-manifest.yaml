paths:
  fergana-and-exile:
    title: "Fergana and Exile"
    point: "Follow the eleven-year-old ruler of Fergana through Samarkand won and lost, Uzbek conquest, and the throneless wandering years."
  kabul-kingdom:
    title: "The Kabul Kingdom"
    point: "Watch Babur take Kabul in 1504 and rule it: gardens, raids, the Herat visit, and the base for Hindustan."
  conquest-of-hindustan:
    title: "Conquest of Hindustan"
    point: "Read Panipat 1526 and Khanua 1527, the fall of the Ludi sultanate, and the founding of Mughal rule at Agra."
  gardens-and-natural-world:
    title: "Gardens and the Natural World"
    point: "Track gardens laid out, fruits ranked, animals described, and the famous homesickness for melons."
  the-man-himself:
    title: "The Man Himself"
    point: "Meet the self-portrait: defeats admitted, wine renounced, verses judged, friends mourned, faults recorded."
