    title: "Alchemy and Chymistry"
    point: "Read chymical notes as working procedures and systems."
  theology-and-chronology:
    title: "Theology and Chronology"
    point: "Trace scriptural, prophetic, and chronological reasoning."
  public-private-newton:
    title: "Public and Private Newton"
    point: "Compare drafts, letters, disputes, and publication decisions."
