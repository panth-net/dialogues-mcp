  full-dev:
    visible_to_users: false
    description: "Curator-only harvest of all candidate records."
paths:
  drafts-and-revisions:
    title: "Drafts and Revisions"
    point: "Treat correction, cancellation, and alternate versions as evidence."
  mathematical-thinking:
    title: "Mathematical Thinking"
    point: "Trace propositions, calculations, diagrams, and method."
  optics-and-experiment:
    title: "Optics and Experiment"
    point: "Follow experimental reasoning around light, color, and instruments."
