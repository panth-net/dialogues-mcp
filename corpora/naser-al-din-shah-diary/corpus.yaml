id: naser-al-din-shah-diary
title: Naser al-Din Shah Diary
subtitle: The 1873 European grand tour of the Shah of Persia, in his own day-by-day account
tagline: "A Persian Shah's personal diary of his 1873 grand tour of Europe — railways, ballets, battleships, and empires seen through curious royal eyes."
description: >
  A curated-source capsule for the diary Naser al-Din Shah Qajar kept on his
  first journey to Europe in 1873, in J. W. Redhouse's English translation:
  the Caspian crossing and the Volga, the Winter Palace and Tsar Alexander II,
  Berlin and Wilhelm I, Queen Victoria's Britain with its naval reviews and
  arsenals, Paris after the Commune, Vienna's World Exhibition, and a
  monarch's running commentary on trains, ballets, factories, and courts.
