id: teika-diary
title: Fujiwara no Teika Diary
subtitle: Meigetsuki, fifty-six years of court, poetry, and the night sky in Teika's own hand
tagline: "A great classical Japanese poet's diary spanning 56 years of court life — poetry contests, promotions denied, comets observed — kept while he shaped the canon of Japanese verse."
description: >
  A catalog-only capsule for Meigetsuki, the diary Fujiwara no Teika (1162-1241)
  kept from 1180 to 1235: court promotion anxieties, poetry contests and the
  compiling of the Shin Kokinshu and Hyakunin Isshu, the red aurora of 1204, the
  guest-star records astronomers still cite for the 1054 supernova, and a
  lifetime of illness complaints, written in kanbun in the poet's own hand.
languages:
  - ja
type: diary
status: source_manifest_ready
data_policy: curated_public_source_manifest_only
default_search_mode: fts
guide: guide.md
