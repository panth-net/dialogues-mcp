version: 1
corpus_id: teika-diary
source_policy: user_downloaded_from_original_sources
default_mode: curated-core
download_modes:
  curated-core:
    visible_to_users: true
    description: "Catalog records plus import instructions only. Nothing downloads: the records point at manuscript image records for surviving autograph sections and explain how to obtain and import a permitted transcription."
  full-dev:
    visible_to_users: false
    description: "Curator-only candidates for fuller Meigetsuki source work."
paths:
  sky-and-omens:
    title: "Sky and Omens"
    point: "Follow the 1204 red aurora nights, the 1230 guest-star list with the 1054 supernova record, comets, and eclipses."
  court-and-career:
    title: "Court and Career"
    point: "Trace promotion anxieties, Go-Toba's favor and ban, the Jokyu War, and the long climb to middle counselor."
  poetry-and-canon:
    title: "Poetry and Canon"
    point: "Watch the Shin Kokinshu commission, poetry contests, the Shin Chokusenshu, and the Hyakunin Isshu selection."
  illness-and-daily-life:
    title: "Illness and Daily Life"
    point: "Read the health complaints, fires, famines, and Kyoto weather that fill the entries between ceremonies."
