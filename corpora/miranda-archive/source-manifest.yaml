    why_skip: "HathiTrust blocks bulk/programmatic download and its catalog 403s scripted requests, so nothing is fetched. Open the record in a browser to read volumes page by page; per-volume full-view status varies. The modern Colombeia edition (1978- ) is copyrighted and excluded."
