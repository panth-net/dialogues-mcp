version: 1
corpus_id: miranda-archive
source_policy: user_downloaded_from_original_sources
default_mode: curated-core
download_modes:
  curated-core:
    visible_to_users: true
    description: "Verified public-domain Miranda primary-source volumes downloaded as OCR text from archive.org (the 1928 Robertson edition of the 1783-1784 US travel diary, the 1794 Dumouriez correspondence, the 1810 Antepara documents, the 1811 Biggs Leander account, the 1889 French-Revolution documents volume, the 1884 Rojas documentary biography, and the 1931 Fragments diary translation), plus the 1806 Coro proclamation from es.wikisource, after an explicit rights confirmation. The 24-volume Archivo del General Miranda itself stays a HathiTrust catalog pointer."
  full-dev:
    visible_to_users: false
    description: "Curator-only candidates for fuller Miranda source work (further Archivo volumes, related archives)."
paths:
  three-revolutions:
    title: "Three Revolutions"
    point: "Follow one soldier through the American Revolution (Pensacola, 1781, under Spain), the French Revolutionary army (Valmy, Antwerp, his name on the Arc de Triomphe), and Spanish American independence."
  travel-diaries-and-networks:
    title: "Travel Diaries and Networks"
    point: "Read the 1780s tours: the young United States (Washington, Hamilton, Knox), Europe, the Ottoman lands, and Catherine the Great's Russia, in obsessively kept diaries."
  leander-and-the-first-republic:
    title: "Leander and the First Republic"
    point: "Trace the 1806 Leander expedition and the Coro landing, the First Venezuelan Republic, the capitulation of San Mateo in 1812, and the arrest at La Guaira."
  archive-odyssey:
    title: "The Archive's Own Odyssey"
    point: "Track the 63 bound volumes themselves: shipped out in 1812, lost in England, found at Cirencester in 1922, bought by Venezuela, printed in Caracas from 1929."
